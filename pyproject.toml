[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "app/*/  __init__.py"]

[tool.coverage.report]
show_missing = true
