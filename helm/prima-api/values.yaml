# Default values for prima-api.
# Override these in a values file or with --set flags.

replicaCount: 2

image:
  repository: ghcr.io/your-org/prima-api
  pullPolicy: IfNotPresent
  # Overrides the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Service account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  # Extra annotations – used primarily to attach the IRSA role ARN on EKS.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/prima-tech-challenge-api-role
  annotations: {}
  name: "prima-api"

# ── Pod-level settings ───────────────────────────────────────────────────────
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: prima-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── Resource requests/limits ─────────────────────────────────────────────────
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ── Autoscaling ──────────────────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── Scheduling ───────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []

# Prefer spreading pods across nodes to improve availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - prima-api
          topologyKey: kubernetes.io/hostname

# ── Health probes ────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ── Application environment variables ────────────────────────────────────────
env:
  AWS_REGION: "us-east-1"
  DYNAMODB_TABLE_NAME: "prima-tech-challenge-users"
  S3_BUCKET_NAME: "prima-tech-challenge"
  # AWS_ENDPOINT_URL: "http://localstack:4566"  # uncomment for LocalStack

# ── PodDisruptionBudget ──────────────────────────────────────────────────────
pdb:
  enabled: true
  minAvailable: 1
